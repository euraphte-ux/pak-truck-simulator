name: Build Pak Truck Simulator APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Extract Android project
        run: |
          mkdir -p buildsrc
          unzip -o PakTruckSimulatorAndroid.zip -d buildsrc

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v5

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: buildsrc
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish APK release
        uses: softprops/action-gh-release@v5
        with:
          tag_name: apk-v1.0.${{ github.run_number }}
          name: Pak Truck Simulator APK v1.0.${{ github.run_number }}
          body: |
            Pakistani Truck Simulator — Android APK.
            Install the APK on an Android phone.
          files: buildsrc/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: false
